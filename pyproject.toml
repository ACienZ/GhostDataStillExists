[project]
name = "ghost-audit"
version = "0.1.0"
description = "Deterministic deletion-audit agent for HackerRank Orchestrate October 2026 (Ghost Data Still Exists)"
readme = "README.md"
authors = [
    { name = "ACienZ", email = "re_acienz@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pypdf>=6.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
